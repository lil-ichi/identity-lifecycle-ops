    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">secops@identity-governance ~ %</text>

    <text x="20" y="65" class="code-text"><tspan class="highlight">[KILLSWITCH-TRIGGER]</tspan> Target: "bob.hostile@corp.io"</text>
    <text x="20" y="90" class="code-text"><tspan class="cyan">[GITHUB-API]</tspan> DELETE /orgs/corp/members/bob-hostile (Purged ✓)</text>
    <text x="20" y="115" class="code-text"><tspan class="cyan">[SLACK-API]</tspan> Terminated all OAuth tokens &amp; sessions ✓</text>

  </defs>

  <style>
    .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #06b6d4; letter-spacing: 1px; }
    .card-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .metric-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; fill: #06b6d4; }
    .code-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #94a3b8; }
    .highlight { fill: #ef4444; font-weight: 700; }
    .green { fill: #10b981; font-weight: 600; }
    .cyan { fill: #06b6d4; font-weight: 600; }

    @keyframes pulseGlow {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .pulse { animation: pulseGlow 3s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#secBgGrad)" stroke="#1e293b" stroke-width="2" />


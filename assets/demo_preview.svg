    <text x="486" y="28" class="code-text" fill="#64748b">KILLSWITCH REVOCATIONS</text>
    <text x="486" y="62" class="metric-val" fill="#ef4444">100% PURGED</text>

    <rect x="705" y="0" width="215" height="90" rx="10" fill="#0d1526" stroke="#1e293b" />
    <text x="721" y="28" class="code-text" fill="#64748b">LEDGER VERIFICATION</text>
